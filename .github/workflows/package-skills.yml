name: Package Skills

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package skills
        run: |
          for dir in */; do
            if [ -f "${dir}SKILL.md" ]; then
              skill_name="${dir%/}"
              echo "Packaging ${skill_name}..."
              cd "$skill_name"
              zip -r "../${skill_name}.skill" . -x '.*'
              # '.*' strips the ignore rules; keep them in the archive
              if [ -f .gitignore ]; then
                zip -q "../${skill_name}.skill" .gitignore
              fi
              cd ..
              echo "Created ${skill_name}.skill"
            fi
          done

      - name: Upload skill artifacts
        uses: actions/upload-artifact@v4
        with:
          name: skills
          path: "*.skill"

      - name: Create/update release
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Skills
          files: "*.skill"
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
